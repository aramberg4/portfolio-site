[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "16"
  NPM_VERSION = "8"
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/nfl-target-share"
  to = "/nfl-target-share.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
