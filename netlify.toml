[build]
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/nfl-target-share"
  to = "/nfl-target-share.html"
  status = 200

[[redirects]]
  from = "/polywatch-top10"
  to = "/polywatch-top10-postmortem.html"
  status = 200

[[redirects]]
  from = "/polywatch-inverse-losers"
  to = "/polywatch-inverse-losers-postmortem.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
